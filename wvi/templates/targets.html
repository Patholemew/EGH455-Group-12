{% extends "base.html" %}
{% block title %}Identified Targets{% endblock %}
{% block content %}
<h1>Identified targets</h1>
<p>Latest 100 captures. A new image is saved about once per second while a target is detected.</p>

<div class="range-buttons">
  <button class="active" data-type="all">ALL</button>
  <button data-type="valve">VALVE</button>
  <button data-type="aruco">ARUCO</button>
  <button data-type="gauge">GAUGE</button>
</div>

<section class="panel">
  <table>
    <thead>
      <tr>
        <th>Image</th>
        <th>Timestamp</th>
        <th>Type</th>
        <th>Camera position (m)<br><small>Relative to ArUco marker</small></th>
      </tr>
    </thead>
    <tbody id="targets-body"></tbody>
  </table>
</section>
{% endblock %}
