<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WVI{% endblock %} · Group 12</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-page="{{ page }}">
  <nav>
    {% for key, path, label in [('dashboard','/','Dashboard'),
                                ('charts','/charts','Air Quality Charts'),
                                ('targets','/targets','Identified Targets'),
                                ('logs','/logs','Logs')] %}
      <a href="{{ path }}" {% if page == key %}class="active"{% endif %}>{{ label }}</a>
    {% endfor %}
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
