{% extends "base.html" %}
{% block title %}Air Quality Charts{% endblock %}
{% block content %}
<header class="panel page-header">
  <div>
    <h1>Air quality charts</h1>
    <p class="panel-note">Explore environmental readings over time.</p>
  </div>

<div class="range-buttons" role="group" aria-label="Chart time range">
  <button data-minutes="1">1 MINUTE</button>
  <button data-minutes="5">5 MINUTES</button>
  <button class="active" data-minutes="10">10 MINUTES</button>
  <button data-minutes="all">ALL TIME</button>
</div>
</header>

<div class="chart-grid">
  <section class="panel">
    <h2 id="title-temperature_c">Temperature</h2>
    <div class="chart-box"><canvas id="chart-temperature_c"></canvas></div>
  </section>
  <section class="panel">
    <h2 id="title-pressure_hpa">Pressure</h2>
    <div class="chart-box"><canvas id="chart-pressure_hpa"></canvas></div>
  </section>
  <section class="panel">
    <h2 id="title-humidity_pct">Humidity</h2>
    <div class="chart-box"><canvas id="chart-humidity_pct"></canvas></div>
  </section>
  <section class="panel">
    <h2 id="title-light_lux">Light</h2>
    <div class="chart-box"><canvas id="chart-light_lux"></canvas></div>
  </section>
  <section class="panel">
    <h2 id="title-gas_reducing">Reducing (ppm)</h2>
    <div class="chart-box"><canvas id="chart-gas_reducing"></canvas></div>
  </section>
  <section class="panel">
    <h2 id="title-gas_oxidising">Oxidising (ppm)</h2>
    <div class="chart-box"><canvas id="chart-gas_oxidising"></canvas></div>
  </section>
  <section class="panel">
    <h2 id="title-gas_ammonia">Ammonia (ppm)</h2>
    <div class="chart-box"><canvas id="chart-gas_ammonia"></canvas></div>
  </section>
</div>
{% endblock %}
